<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Footer"><title>Footer</title><style>
.f{font-family:'Google Sans','Roboto','Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace}
.up{opacity:0;animation:up .7s cubic-bezier(.2,0,0,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="1000" height="120" rx="28" fill="#1e1f25"/><style>.lid{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}.pup{animation:look 7s ease-in-out infinite}@keyframes look{0%,30%{transform:translate(0,0)}38%,55%{transform:translate(-6px,1px)}63%,80%{transform:translate(6px,-2px)}88%,100%{transform:translate(0,0)}}</style><g transform="translate(110 60) scale(0.62)"><rect x="-90" y="-62" width="180" height="124" rx="40" fill="#00FA5A"/><g class="lid"><g><polygon points="-4,-18 -68,-26 -72,14 -8,24" fill="#0A0216"/><polygon points="-28,-22 -40,-44 -48,-24" fill="#0A0216"/><circle cx="-38" cy="0" r="15" fill="none" stroke="#00FA5A" stroke-width="2.5"/><circle class="pup" cx="-38" cy="0" r="8" fill="#0058EA"/><circle class="pup" cx="-36" cy="-2" r="3.2" fill="#f6f6f6"/></g><g><polygon points="4,-18 68,-26 72,14 8,24" fill="#0A0216"/><polygon points="28,-22 40,-44 48,-24" fill="#0A0216"/><circle cx="38" cy="0" r="15" fill="none" stroke="#00FA5A" stroke-width="2.5"/><circle class="pup" cx="38" cy="0" r="8" fill="#0058EA"/><circle class="pup" cx="40" cy="-2" r="3.2" fill="#f6f6f6"/></g></g></g><text x="200" y="54" class="f" font-size="20" font-weight="700" fill="#e2e2e9">She is watching the build.</text><text x="200" y="82" class="f" font-size="15" fill="#c5c6d0">Most of my work lives in private repositories — GitHub is my backup. Ask me about anything here.</text></svg>