<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="846" viewBox="0 0 1000 846" role="img" aria-label="The AMADEUSE ecosystem"><title>The AMADEUSE ecosystem</title><style>
.f{font-family:'Google Sans','Roboto','Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace}
.up{opacity:0;animation:up .7s cubic-bezier(.2,0,0,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><text x="2" y="36" class="f" font-size="26" font-weight="700" fill="#1a1b20">The <tspan fill="#00b343">AMADEUSE</tspan> ecosystem</text><text x="998" y="36" text-anchor="end" class="f" font-size="15" fill="#757780">one brand · one PC · many devices</text><g class="up" style="animation-delay:0.15s"><rect x="0" y="70" width="487" height="168" rx="24" fill="#eeedf4"/><rect x="28" y="100" width="10" height="26" rx="5" fill="#00b343"/><text x="50" y="121" class="f" font-size="21" font-weight="700" letter-spacing="1" fill="#1a1b20">AMADEUSE OS</text><text x="28" y="162" class="f" font-size="15.5" fill="#44464f">My daily desktop: Arch (EndeavourOS) + Hyprland,</text><text x="28" y="185" class="f" font-size="15.5" fill="#44464f">rebuilt around Quickshell — Material You, live</text><text x="28" y="208" class="f" font-size="15.5" fill="#44464f">widgets, server dashboards, ambient lighting and</text><text x="28" y="231" class="f" font-size="15.5" fill="#44464f">Discord presence.</text></g><g class="up" style="animation-delay:0.25s"><rect x="513" y="70" width="487" height="168" rx="24" fill="#eeedf4"/><rect x="541" y="100" width="10" height="26" rx="5" fill="#475d91"/><text x="563" y="121" class="f" font-size="21" font-weight="700" letter-spacing="1" fill="#1a1b20">AMADEUSE</text><text x="541" y="162" class="f" font-size="15.5" fill="#44464f">The assistant that lives in the PC: wake word, local</text><text x="541" y="185" class="f" font-size="15.5" fill="#44464f">speech, an agent with tools and long-term memory, and</text><text x="541" y="208" class="f" font-size="15.5" fill="#44464f">an encrypted Bluetooth link to every device.</text></g><g class="up" style="animation-delay:0.35s"><rect x="0" y="264" width="487" height="168" rx="24" fill="#eeedf4"/><rect x="28" y="294" width="10" height="26" rx="5" fill="#00b343"/><text x="50" y="315" class="f" font-size="21" font-weight="700" letter-spacing="1" fill="#1a1b20">AMADEUSE WATCHER</text><text x="28" y="356" class="f" font-size="15.5" fill="#44464f">Custom ESP32-S3 firmware for a SenseCAP Watcher:</text><text x="28" y="379" class="f" font-size="15.5" fill="#44464f">procedural neon eyes (42 moods), voice, camera, wheel</text><text x="28" y="402" class="f" font-size="15.5" fill="#44464f">controls, Bad Apple at rest.</text></g><g class="up" style="animation-delay:0.45s"><rect x="513" y="264" width="487" height="168" rx="24" fill="#eeedf4"/><rect x="541" y="294" width="10" height="26" rx="5" fill="#725572"/><text x="563" y="315" class="f" font-size="21" font-weight="700" letter-spacing="1" fill="#1a1b20">AMADEUSE PHONE</text><text x="541" y="356" class="f" font-size="15.5" fill="#44464f">Launcher and system layer for a Galaxy Z Flip: cover</text><text x="541" y="379" class="f" font-size="15.5" fill="#44464f">screen, calls, messages, theme synced from the PC over</text><text x="541" y="402" class="f" font-size="15.5" fill="#44464f">Bluetooth.</text></g><g class="up" style="animation-delay:0.55s"><rect x="0" y="458" width="487" height="168" rx="24" fill="#eeedf4"/><rect x="28" y="488" width="10" height="26" rx="5" fill="#475d91"/><text x="50" y="509" class="f" font-size="21" font-weight="700" letter-spacing="1" fill="#1a1b20">AMADEUSE DECK</text><text x="28" y="550" class="f" font-size="15.5" fill="#44464f">Phone and PC games streamed into a Quest 2, with a</text><text x="28" y="573" class="f" font-size="15.5" fill="#44464f">home space of its own and standalone VR tracking.</text></g><g class="up" style="animation-delay:0.65s"><rect x="513" y="458" width="487" height="168" rx="24" fill="#eeedf4"/><rect x="541" y="488" width="10" height="26" rx="5" fill="#00b343"/><text x="563" y="509" class="f" font-size="21" font-weight="700" letter-spacing="1" fill="#1a1b20">AMADEUSE NODES</text><text x="541" y="550" class="f" font-size="15.5" fill="#44464f">Raspberry Pi, PINE A64, iPad, ESP32 screens and LED</text><text x="541" y="573" class="f" font-size="15.5" fill="#44464f">panels — small devices that mirror her eyes live and</text><text x="541" y="596" class="f" font-size="15.5" fill="#44464f">extend the desk.</text></g><g class="up" style="animation-delay:0.75s"><rect x="0" y="652" width="487" height="168" rx="24" fill="#eeedf4"/><rect x="28" y="682" width="10" height="26" rx="5" fill="#725572"/><text x="50" y="703" class="f" font-size="21" font-weight="700" letter-spacing="1" fill="#1a1b20">SLIME STUDIO</text><text x="28" y="744" class="f" font-size="15.5" fill="#44464f">My game studio: idle, tower, life-sim and VR projects,</text><text x="28" y="767" class="f" font-size="15.5" fill="#44464f">a social platform, a Discord bot and a Minecraft</text><text x="28" y="790" class="f" font-size="15.5" fill="#44464f">network.</text></g><g class="up" style="animation-delay:0.85s"><rect x="513" y="652" width="487" height="168" rx="24" fill="#eeedf4"/><rect x="541" y="682" width="10" height="26" rx="5" fill="#575e71"/><text x="563" y="703" class="f" font-size="21" font-weight="700" letter-spacing="1" fill="#1a1b20">AND MORE</text><text x="541" y="744" class="f" font-size="15.5" fill="#44464f">AI runtimes, a terminal coding agent, a browser,</text><text x="541" y="767" class="f" font-size="15.5" fill="#44464f">Blender character animation, 3D-printed parts and</text><text x="541" y="790" class="f" font-size="15.5" fill="#44464f">console homebrew.</text></g></svg>