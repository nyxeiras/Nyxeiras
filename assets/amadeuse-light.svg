<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="377" viewBox="0 0 1000 377" role="img" aria-label="AMADEUSE and Slime Studio"><title>AMADEUSE and Slime Studio</title><style>
.f{font-family:'Google Sans','Roboto','Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace}
.up{opacity:0;animation:up .7s cubic-bezier(.2,0,0,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="1000" height="377" rx="28" fill="#eeedf4"/><rect x="40" y="40" width="10" height="30" rx="5" fill="#00b343"/><text x="64" y="64" class="f" font-size="26" font-weight="700" letter-spacing="2" fill="#1a1b20">AMADEUSE</text><g class="up" style="animation-delay:0.20s"><rect x="262" y="42" width="89" height="28" rx="14" fill="#e8e7ef"/><text x="306" y="61" text-anchor="middle" class="f" font-size="14" fill="#44464f">Firmware</text></g><g class="up" style="animation-delay:0.28s"><rect x="358.72" y="42" width="151" height="28" rx="14" fill="#e8e7ef"/><text x="434" y="61" text-anchor="middle" class="f" font-size="14" fill="#44464f">Operating system</text></g><g class="up" style="animation-delay:0.36s"><rect x="518.1600000000001" y="42" width="104" height="28" rx="14" fill="#e8e7ef"/><text x="570" y="61" text-anchor="middle" class="f" font-size="14" fill="#44464f">AI &amp; voice</text></g><g class="up" style="animation-delay:0.44s"><rect x="630.5600000000001" y="42" width="57" height="28" rx="14" fill="#e8e7ef"/><text x="659" y="61" text-anchor="middle" class="f" font-size="14" fill="#44464f">Apps</text></g><g class="up" style="animation-delay:0.52s"><rect x="695.9200000000001" y="42" width="65" height="28" rx="14" fill="#e8e7ef"/><text x="729" y="61" text-anchor="middle" class="f" font-size="14" fill="#44464f">Games</text></g><g class="up" style="animation-delay:0.60s"><rect x="769.1200000000001" y="42" width="81" height="28" rx="14" fill="#e8e7ef"/><text x="810" y="61" text-anchor="middle" class="f" font-size="14" fill="#44464f">Servers</text></g><g class="up" style="animation-delay:.5s"><text x="40" y="110" class="f" font-size="17" fill="#44464f">AMADEUSE is my own brand and my main project: a personal computing world built around one</text></g><g class="up" style="animation-delay:.5s"><text x="40" y="137" class="f" font-size="17" fill="#44464f">assistant. She has a voice, a memory, moods and real eyes, she lives on the machines I use every</text></g><g class="up" style="animation-delay:.5s"><text x="40" y="164" class="f" font-size="17" fill="#44464f">day, and she follows me from screen to screen. I design the whole stack myself — from custom</text></g><g class="up" style="animation-delay:.5s"><text x="40" y="191" class="f" font-size="17" fill="#44464f">firmware and boot chains to the desktop, the AI that drives it, the apps around it and the servers</text></g><g class="up" style="animation-delay:.5s"><text x="40" y="218" class="f" font-size="17" fill="#44464f">behind it — so that everything talks to everything.</text></g><rect x="40" y="253" width="10" height="26" rx="5" fill="#725572"/><text x="64" y="275" class="f" font-size="21" font-weight="700" letter-spacing="1.5" fill="#1a1b20">SLIME STUDIO</text><g class="up" style="animation-delay:.7s"><text x="40" y="311" class="f" font-size="17" fill="#44464f">SLIME STUDIO is where I make games and community tools: game prototypes, a self-hosted social</text></g><g class="up" style="animation-delay:.7s"><text x="40" y="338" class="f" font-size="17" fill="#44464f">platform, bots and game servers.</text></g></svg>