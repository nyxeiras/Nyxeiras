@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><text x="2" y="36" class="f" font-size="26" font-weight="700" fill="#1a1b20">What I do</text><text x="2" y="72" class="f" font-size="14" font-weight="600" letter-spacing="2" fill="#00b343">HARDWARE &amp; EMBEDDED</text><g class="up" style="animation-delay:0.100s"><rect x="0" y="86" width="248" height="36" rx="12" fill="#e8e7ef"/><circle cx="14" cy="104" r="4" fill="#00b343"/><text x="131" y="109" text-anchor="middle" class="f" font-size="15" fill="#1a1b20">ESP32 / ESP-IDF firmware</text></g><g class="up" style="animation-delay:0.125s"><rect x="257.6" y="86" width="231" height="36" rx="12" fill="#e8e7ef"/><circle cx="271.6" cy="104" r="4" fill="#00b343"/><text x="380" y="109" text-anchor="middle" class="f" font-size="15" fill="#1a1b20">Bluetooth LE protocols</text></g><g class="up" style="animation-delay:0.150s"><rect x="498.40000000000003" y="86" width="256" height="36" rx="12" fill="#e8e7ef"/><circle cx="512.4000000000001" cy="104" r="4" fill="#00b343"/><text x="633" y="109" text-anchor="middle" class="f" font-size="15" fill="#1a1b20">Raspberry Pi &amp; ARM boards</text></g><g class="up" style="animation-delay:0.175s"><rect x="764.4000000000001" y="86" width="197" height="36" rx="12" fill="#e8e7ef"/><circle cx="778.4000000000001" cy="104" r="4" fill="#00b343"/><text x="870" y="109" text-anchor="middle" class="f" font-size="15" fill="#1a1b20">SPI / TFT displays</text></g><g class="up" style="animation-delay:0.200s"><rect x="0" y="132" width="130" height="36" rx="12" fill="#e8e7ef"/><circle cx="14" cy="150" r="4" fill="#00b343"/><text x="72" y="155" text-anchor="middle" class="f" font-size="15" fill="#1a1b20">LED panels</text></g><g class="up" style="animation-delay:0.225s"><rect x="140.0" y="132" width="256" height="36" rx="12" fill="#e8e7ef"/><circle cx="154.0" cy="150" r="4" fill="#00b343"/><text x="275" y="155" text-anchor="middle" class="f" font-size="15" fill="#1a1b20">Boot chains (U-Boot, FEL)</text></g><text x="2" y="204" class="f" font-size="14" font-weight="600" letter-spacing="2" fill="#475d91">AI &amp; VOICE</text><g class="up" style="animation-delay:0.250s"><rect x="0" y="218" width="166" height="36" rx="12" fill="#d9e2ff"/><text x="83" y="241" text-anchor="middle" class="f" font-size="15" fill="#001945">Voice assistants</text></g><g class="up" style="animation-delay:0.275s"><rect x="176.4" y="218" width="183" height="36" rx="12" fill="#d9e2ff"/><text x="268" y="241" text-anchor="middle" class="f" font-size="15" fill="#001945">Wake word &amp; speech</text></g><g class="up" style="animation-delay:0.300s"><rect x="369.6" y="218" width="234" height="36" rx="12" fill="#d9e2ff"/><text x="486" y="241" text-anchor="middle" class="f" font-size="15" fill="#001945">LLM agents &amp; tools (MCP)</text></g><g class="up" style="animation-delay:0.325s"><rect x="613.2" y="218" width="133" height="36" rx="12" fill="#d9e2ff"/><text x="680" y="241" text-anchor="middle" class="f" font-size="15" fill="#001945">Local models</text></g><g class="up" style="animation-delay:0.350s"><rect x="756.0" y="218" width="158" height="36" rx="12" fill="#d9e2ff"/><text x="835" y="241" text-anchor="middle" class="f" font-size="15" fill="#001945">Computer vision</text></g><text x="2" y="290" class="f" font-size="14" font-weight="600" letter-spacing="2" fill="#725572">LINUX &amp; DESKTOP</text><g class="up" style="animation-delay:0.375s"><rect x="0" y="304" width="208" height="36" rx="12" fill="#fdd7fb"/><text x="104" y="327" text-anchor="middle" class="f" font-size="15" fill="#2a132c">Hyprland / Quickshell</text></g><g class="up" style="animation-delay:0.400s"><rect x="218.4" y="304" width="116" height="36" rx="12" fill="#fdd7fb"/><text x="276" y="327" text-anchor="middle" class="f" font-size="15" fill="#2a132c">Arch Linux</text></g><g class="up" style="animation-delay:0.425s"><rect x="344.40000000000003" y="304" width="141" height="36" rx="12" fill="#fdd7fb"/><text x="415" y="327" text-anchor="middle" class="f" font-size="15" fill="#2a132c">Sys