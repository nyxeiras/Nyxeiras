ord bots</text></g><g class="up" style="animation-delay:0.650s"><rect x="319.20000000000005" y="436" width="175" height="36" rx="12" fill="#dce2f9"/><text x="407" y="459" text-anchor="middle" class="f" font-size="15" fill="#141b2c">Minecraft servers</text></g><g class="up" style="animation-delay:0.675s"><rect x="504.00000000000006" y="436" width="175" height="36" rx="12" fill="#dce2f9"/><text x="591" y="459" text-anchor="middle" class="f" font-size="15" fill="#141b2c">Blender animation</text></g><g class="up" style="animation-delay:0.700s"><rect x="688.8000000000001" y="436" width="124" height="36" rx="12" fill="#dce2f9"/><text x="751" y="459" text-anchor="middle" class="f" font-size="15" fill="#141b2c">3D printing</text></g><g class="up" style="animation-delay:0.725s"><rect x="823.2" y="436" width="166" height="36" rx="12" fill="#dce2f9"/><text x="906" y="459" text-anchor="middle" class="f" font-size="15" fill="#141b2c">Console homebrew</text></g><g class="up" style="animation-delay:0.750s"><rect x="0" y="482" width="208" height="36" rx="12" fill="#dce2f9"/><text x="104" y="505" text-anchor="middle" class="f" font-size="15" fill="#141b2c">Self-hosting &amp; DevOps</text></g></svg>