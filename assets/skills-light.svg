<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="534" viewBox="0 0 1000 534" role="img" aria-label="What I do"><title>What I do</title><style>
.f{font-family:'Google Sans','Roboto','Segoe UI','Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace}
.up{opacity:0;animation:up .7s cubic-bezier(.2,0,0,1) forwards}
